services:
  db:
    image: postgres:16
    container_name: demo-db
    environment:
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD}
      POSTGRES_USER: ${DEMO_DB_USER}
      POSTGRES_DB: ${DEMO_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: demo-web
    command: java -jar demo.jar
    ports:
      - 8080:8080
    depends_on:
      - db
      - redis
    environment:
      DEMO_DB_ADDRESS: ${DEMO_DB_ADDRESS}
      DEMO_DB_PORT: ${DEMO_DB_PORT}
      DEMO_DB_NAME: ${DEMO_DB_NAME}
      DEMO_DB_USER: ${DEMO_DB_USER}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD}
      DEMO_REDIS_HOST: ${DEMO_REDIS_HOST}
      DEMO_REDIS_PORT: ${DEMO_REDIS_PORT}

  redis:
    image: redis:latest
    container_name: demo-redis
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data:
